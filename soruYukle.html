<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Çözüm Merkezi - Soru Yükle</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #2c3e50; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .back-btn { background-color: #7f8c8d; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .back-btn:hover { background-color: #626567; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: block; margin-bottom: 5px; color: #34495e; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button[type="submit"] { width: 100%; padding: 12px; background-color: #e67e22; color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button[type="submit"]:hover { background-color: #d35400; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        
        .list-container { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        .soru-item { background: #f9f9f9; border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .soru-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; }
    </style>
</head>
<body>

<div class="card">
  <div class="top-bar">
    <span id="userInfo" style="font-weight: bold; color: #2c3e50;">Yükleniyor...</span>
    <button class="back-btn" onclick="window.location.href='index.html'">⬅ Geri Dön</button>
  </div>

  <h2>📸 Yapamadığım Soru Yükleme</h2>
  <form id="uploadForm">
    
    <div class="form-group">
      <label>Ders Seçin:</label>
      <select id="ders" required>
        <option value="Matematik">Matematik</option>
        <option value="Türkçe">Türkçe</option>
        <option value="Fen Bilimleri">Fen Bilimleri</option>
        <option value="Sosyal Bilgiler">Sosyal Bilgiler</option>
        <option value="İngilizce">İngilizce</option>
        <option value="Din Kültürü">Din Kültürü</option>
        <option value="Paragraf">Paragraf</option>
      </select>
    </div>

    <div class="form-group">
      <label>Soru Fotoğrafı (Kameradan Çek veya Dosya Seç):</label>
      <!-- capture="environment" cep telefonlarında doğrudan arka kamerayı açar -->
      <input type="file" id="soruDosya" accept="image/*" capture="environment" required>
    </div>

    <button type="submit" id="submitBtn">📤 Soruyu Hocaya Gönder</button>
  </form>
  <div id="status"></div>

  <div class="list-container">
    <h3>Yüklediğiniz Çözülemeyen Sorular</h3>
    <div id="yuklenenSorularListesi">
      <p style="text-align: center; color: #777;">Yüklenen sorularınız listeleniyor...</p>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9yuXCjFbfvYI_3f737Bt3Gmopg8LPY8gDCNtU4slqs4Ge8UK_P2M5rh2dZsBDM8A/exec";

  const aktifNo = sessionStorage.getItem("girisYapanNo") || localStorage.getItem("ogrNo");
  const aktifAd = sessionStorage.getItem("girisYapanAd") || localStorage.getItem("adSoyad");

  if (!aktifNo || !aktifAd) {
    window.location.replace("indexLogin.html");
  } else {
    document.getElementById("userInfo").innerText = `Öğrenci: ${aktifAd} (${aktifNo})`;
    sorularimiGetir(aktifNo);
  }

  // Fotoğrafı Base64 formatına çevirip Google Apps Script'e gönderme
  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const statusDiv = document.getElementById('status');
    const fileInput = document.getElementById('soruDosya');
    const ders = document.getElementById('ders').value;

    if (fileInput.files.length === 0) {
      alert("Lütfen bir fotoğraf seçin veya çekin!");
      return;
    }

    const file = fileInput.files[0];
    statusDiv.innerText = "Fotoğraf yükleniyor, lütfen bekleyin...";
    statusDiv.style.color = "blue";

    const reader = new FileReader();
    reader.onload = function(event) {
      const base64Data = event.target.result.split(',')[1]; // Base64 gövdesi
      const mimeType = file.type;
      const fileName = `${aktifNo}_${Date.now()}_${file.name}`;

      const payload = {
        action: "soruYukle",
        ogrenciNo: aktifNo,
        ogrenciIsim: aktifAd,
        ders: ders,
        dosyaAdi: fileName,
        mimeType: mimeType,
        fileContent: base64Data
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.result === "success") {
          statusDiv.innerText = "🎉 Soru başarıyla hocaya gönderildi!";
          statusDiv.style.color = "green";
          fileInput.value = "";
          sorularimiGetir(aktifNo);
          setTimeout(() => { statusDiv.innerText = ""; }, 3000);
        } else {
          statusDiv.innerText = "❌ Yükleme başarısız: " + (data.error || "");
          statusDiv.style.color = "red";
        }
      })
      .catch(err => {
        statusDiv.innerText = "❌ Bağlantı Hatası: " + err;
        statusDiv.style.color = "red";
      });
    };
    reader.readAsDataURL(file);
  });

  function sorularimiGetir(no) {
    fetch(`${SCRIPT_URL}?action=sorulariGetir&no=${no}`)
      .then(res => res.json())
      .then(data => {
        const listeDiv = document.getElementById('yuklenenSorularListesi');
        listeDiv.innerHTML = "";
        if (data.success && data.sorular && data.sorular.length > 0) {
          data.sorular.forEach(item => {
            const div = document.createElement('div');
            div.className = 'soru-item';
            div.innerHTML = `
              <div>
                <b>Ders:</b> ${item.ders}<br>
                <small style="color: #666;">Tarih: ${item.tarih}</small>
              </div>
              <div>
                <a href="${item.url}" target="_blank">
                  <img src="${item.url}" alt="Soru Resmi" title="Büyütmek için tıklayın">
                </a>
              </div>
            `;
            listeDiv.appendChild(div);
          });
        } else {
          listeDiv.innerHTML = `<p style="text-align: center; color: #777;">Henüz yüklediğiniz bir soru bulunmuyor.</p>`;
        }
      })
      .catch(err => {
        document.getElementById('yuklenenSorularListesi').innerHTML = `<p style="text-align: center; color: red;">Sorular yüklenemedi.</p>`;
      });
  }
</script>

</body>
</html>
