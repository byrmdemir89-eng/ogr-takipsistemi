<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğretmen Kayıt Ol</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #34495e; font-size: 14px; }
        .zorunlu::after { content: " *"; color: #e74c3c; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #3498db; outline: none; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #219150; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-link a { color: #3498db; text-decoration: none; font-weight: bold; }
        .login-link a:hover { text-decoration: underline; }
        .spinner { display: none; text-align: center; margin: 15px 0; font-weight: bold; color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h2>👨‍🏫 Öğretmen Kayıt Paneli</h2>

    <div class="form-group">
        <label for="eposta" class="zorunlu">E-Posta Adresi:</label>
        <input type="email" id="eposta" placeholder="ornek@mail.com" required>
    </div>

    <div class="form-group">
        <label for="adSoyad" class="zorunlu">Ad Soyad:</label>
        <input type="text" id="adSoyad" placeholder="Adınız Soyadınız" required>
    </div>

    <div class="form-group">
        <label for="sifre" class="zorunlu">Şifre:</label>
        <input type="password" id="sifre" placeholder="En az 6 karakterli şifre" required>
    </div>

    <div class="form-group">
        <label for="brans">Branş (İsteğe Bağlı):</label>
        <input type="text" id="brans" placeholder="Örn: Matematik">
    </div>

    <div class="form-group">
        <label for="rehberHoca">Sınıf Rehber Hocası / Sınıfı (İsteğe Bağlı):</label>
        <input type="text" id="rehberHoca" placeholder="Örn: 9-A Rehber Öğretmeni">
    </div>

    <div class="form-group">
        <label for="okul">Okul Adı (İsteğe Bağlı):</label>
        <input type="text" id="okul" placeholder="Görev yaptığınız okul">
    </div>

    <button onclick="ogretmenKayitOl()">Kayıt Ol</button>

    <div id="loading" class="spinner">⏳ Kayıt oluşturuluyor, lütfen bekleyin...</div>

    <div class="login-link">
        Zaten hesabınız var mı? <a href="ogretmenGiris.html">Giriş Yap</a>
    </div>
</div>
<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNBauXzfZvefxpCvYp_A0A0901gexKl7h7TuxEuVqqHBYvdyo8Dy6TQdf86cexiTk/exec";

    function ogretmenKayitOl() {
        const eposta = document.getElementById("eposta").value.trim();
        const adSoyad = document.getElementById("adSoyad").value.trim();
        const sifre = document.getElementById("sifre").value.trim();
        const brans = document.getElementById("brans").value.trim();
        const rehberHoca = document.getElementById("rehberHoca").value.trim();
        const okul = document.getElementById("okul").value.trim();
        const loading = document.getElementById("loading");

        if (!eposta || !adSoyad || !sifre) {
            alert("Lütfen zorunlu alanları (E-Posta, Ad Soyad, Şifre) doldurun!");
            return;
        }

        loading.style.display = "block";

        const url = `${SCRIPT_URL}?action=ogretmenKayit&eposta=${encodeURIComponent(eposta)}&sifre=${encodeURIComponent(sifre)}&adSoyad=${encodeURIComponent(adSoyad)}&brans=${encodeURIComponent(brans)}&rehberHoca=${encodeURIComponent(rehberHoca)}&okul=${encodeURIComponent(okul)}`;

        fetch(url)
        .then(res => res.text()) // Önce ham metin olarak alalım ki HTML hata sayfası dönerse yakalayabilelim
        .then(rawText => {
            loading.style.display = "none";
            console.log("Sunucu Ham Yanıtı:", rawText); // F12 Konsolunda ne geldiğini görmek için
            
            try {
                const data = JSON.parse(rawText);
                if (data.success) {
                    alert("Tebrikler, kaydınız alındı! Giriş sayfasına yönlendiriliyorsunuz.");
                    window.location.href = "ogretmenGiris.html";
                } else {
                    alert("Sunucu Hatası: " + data.error);
                }
            } catch (jsonErr) {
                // Eğer sunucu JSON yerine Google'ın HTML hata sayfasını döndürürse burada yakalayacağız
                alert("Kritik Sistem Yanıtı (JSON Değil): " + rawText);
            }
        })
        .catch(err => {
            loading.style.display = "none";
            alert("Fetch Bağlantı Hatası: " + err);
            console.error(err);
        });
    }
</script>
</body>
</html>
