<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Giriş Ekranı</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .register-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .register-link a {
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔐 Öğrenci Girişi</h2>
    
    <div class="form-group">
        <label for="ogrNo">Öğrenci Numarası</label>
        <input type="text" id="ogrNo" placeholder="Okul numaranızı girin">
    </div>

    <div class="form-group">
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" placeholder="Şifrenizi girin">
    </div>

    <button onclick="girisYap()">Giriş Yap</button>
    <div id="loading">⏳ Giriş yapılıyor, lütfen bekleyin...</div>

    <div class="register-link">
        Hesabınız yok mu? <a href="kayitOl.html">Kayıt Ol</a>
    </div>

<div class="teacher-link" style="text-align: center; margin-top: 15px; font-size: 14px;">
    Bir öğretmen misiniz? <a href="ogretmenGiris.html" style="color: #2980b9; text-decoration: none; font-weight: bold;">Öğretmen Girişi için tıklayın</a>
</div>
</div>

<script>
    // Google Apps Script Web App URL'niz
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9yuXCjFbfvYI_3f737Bt3Gmopg8LPY8gDCNtU4slqs4Ge8UK_P2M5rh2dZsBDM8A/exec";

    function girisYap() {
        const ogrNo = document.getElementById("ogrNo").value.trim();
        const sifre = document.getElementById("sifre").value.trim();
        const loading = document.getElementById("loading");

        if (!ogrNo || !sifre) {
            alert("Lütfen numaranızı ve şifrenizi girin!");
            return;
        }

        loading.style.display = "block";

        fetch(`${SCRIPT_URL}?action=girisYap&ogrNo=${encodeURIComponent(ogrNo)}&sifre=${encodeURIComponent(sifre)}`)
        .then(res => res.text())
        .then(text => {
            loading.style.display = "none";
            try {
                const data = JSON.parse(text);
                if (data.error) {
                    alert("Hata: " + data.error);
                } else {
                    // Giriş başarılı! Bilgileri hem localStorage hem sessionStorage'a kaydedelim
                    localStorage.setItem("ogrNo", data.ogrNo);
                    localStorage.setItem("adSoyad", data.adSoyad);
                    localStorage.setItem("sinif", data.sinif || "");
                    localStorage.setItem("sube", data.sube || "");

                    // Oturum hafızasına eksiksiz yazıyoruz (Profil sayfasının dolması için)
                    sessionStorage.setItem("girisYapanNo", data.ogrNo);
                    sessionStorage.setItem("girisYapanAd", data.adSoyad);
                    sessionStorage.setItem("girisYapanSifre", data.sifre || sifre); // Şifre dönmezse girileni al
                    sessionStorage.setItem("girisYapanSinif", data.sinif || "");
                    sessionStorage.setItem("girisYapanSube", data.sube || "");
                    
                    // Ana uygulama sayfasına yönlendirme (index.html)
                    window.location.href = "index.html";
                }
            } catch (e) {
                alert("Sunucudan yanıt alınamadı: " + text);
            }
        })
        .catch(err => {
            loading.style.display = "none";
            alert("Bağlantı Hatası: " + err);
        });
    }
</script>

</body>
</html>
